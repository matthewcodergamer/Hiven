<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hiven</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 16px 16px 8px;
      }
      header img { width: 28px; height: 28px; border-radius: 7px; }
      header strong {
        font-size: 17px;
        letter-spacing: -0.03em;
        font-weight: 600;
      }
      .sub {
        margin: 0;
        padding: 0 16px 14px;
        color: #6e6e73;
        font-size: 13px;
      }
      button {
        border: 0;
        font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
      }
      #scan {
        margin: 0 16px 12px;
        width: calc(100% - 32px);
        height: 40px;
        border-radius: 980px;
        background: #ff3b30;
        color: #fff;
      }
      #scan:disabled { opacity: 0.45; cursor: default; }
      #status {
        margin: 0 16px 8px;
        color: #86868b;
        font-size: 12px;
        min-height: 1.2em;
      }
      #list { padding: 0 10px 12px; }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 8px;
        border-radius: 12px;
        background: #fff;
        margin-bottom: 6px;
      }
      .meta { min-width: 0; flex: 1; }
      .meta p { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .kind { color: #86868b; font-size: 11px; }
      .save, .held {
        flex-shrink: 0;
        height: 32px;
        padding: 0 12px;
        border-radius: 980px;
      }
      .save { background: #ff3b30; color: #fff; }
      .held { background: #ececef; color: #6e6e73; }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 16px 16px;
        color: #86868b;
        font-size: 11px;
      }
      footer a { color: #ff3b30; text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" alt="" width="28" height="28" />
      <strong>Hiven</strong>
    </header>
    <p class="sub">Scan this tab for accessible video. Hiven will not extract YouTube, defeat DRM, or bypass access controls.</p>
    <button id="scan" type="button">Scan this tab</button>
    <p id="status"></p>
    <div id="list"></div>
    <footer>
      <span>v0.1.1</span>
      <a href="https://matthewcodergamer.github.io/Hiven/" target="_blank" rel="noreferrer">Website</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
